[workspace]
resolver = "2"
members = [
    # Core libraries (injection toolkit foundation)
    "core/itk-shmem",
    "core/itk-ipc",
    "core/itk-protocol",
    "core/itk-sync",
    "core/itk-video",
    "core/itk-net",
    # Framework templates
    "daemon",
    "overlay",
    "injectors/linux/ld-preload",
    "injectors/windows/native-dll",
    # NMS Cockpit Video Player
    "projects/nms-cockpit-video/daemon",
    "projects/nms-cockpit-video/overlay",
    "projects/nms-cockpit-video/injector",
    "projects/nms-cockpit-video/launcher",
    # Development tools
    "tools/mem-scanner",
]
# Windows-only crates excluded from default builds (require nightly + Windows).
# Build explicitly with: cargo build -p nms-cockpit-injector -p nms-video-launcher -p itk-native-dll
default-members = [
    "core/itk-shmem",
    "core/itk-ipc",
    "core/itk-protocol",
    "core/itk-sync",
    "core/itk-video",
    "core/itk-net",
    "daemon",
    "overlay",
    "injectors/linux/ld-preload",
    "projects/nms-cockpit-video/daemon",
    "projects/nms-cockpit-video/overlay",
    "tools/mem-scanner",
]
# MCP tools have their own workspace (mcp_core_rust) -- exclude from root
exclude = [
    "tools/mcp/mcp_core_rust",
    "tools/mcp/mcp_memory_explorer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AndrewAltimit/game-mods"
authors = ["AndrewAltimit"]

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
bitcode = { version = "0.6", features = ["serde"] }
bincode = "1.3" # Legacy: only used in itk-net (laminar dependency)

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Cross-platform utilities
cfg-if = "1.0"

# CRC for protocol validation
crc32fast = "1.4"

# Video decoding
ffmpeg-next = "7.0"

# Audio output
cpal = "0.15"
ringbuf = "0.4"

# Networking
laminar = "0.5"

# Synchronization (never poisons, unlike std::sync::Mutex)
parking_lot = "0.12"

# Vulkan
ash = { version = "0.38", features = ["loaded"] }

# Hooking
retour = { version = "0.3", features = ["static-detour"] }

# Platform-specific (Windows)
[workspace.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_UI_Input_KeyboardAndMouse",
]

# Platform-specific (Unix)
[workspace.dependencies.libc]
version = "0.2"

[workspace.dependencies.nix]
version = "0.29"
features = ["mman", "fs"]

[workspace.lints.clippy]
clone_on_ref_ptr = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
